- step:
    name: train
    image: tensorflow/tensorflow
    command: python train.py
    environment: aws-spot-env
    autorestart: true

- step:
    name: predict
    image: tensorflow/tensorflow
    command: python predict.py

- pipeline:
    name: Training pipeline
    nodes:
      - name: train-node
        type: execution
        step: train
        override:
          # an explicit `false` must win over the step's `true`
          autorestart: false
      - name: predict-node
        type: execution
        step: predict
        override:
          # autorestart can be set even when the step does not define it
          autorestart: true
      - name: train-task-node
        type: task
        step: train
        override:
          autorestart: false
      - name: inherit-node
        type: execution
        step: train
        override:
          # an override that does not mention autorestart keeps the step's value
          image: another/image
      - name: remote-node
        type: execution
        commit: "library:some-library/train"
        step: remote-train
        override:
          # the step lives in another config, so only the override can set this
          autorestart: true
    edges: []

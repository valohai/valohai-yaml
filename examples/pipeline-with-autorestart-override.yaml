- step:
    name: train
    image: tensorflow/tensorflow
    command: python train.py
    environment: aws-spot-env
    autorestart: true

- pipeline:
    name: Training pipeline
    nodes:
      - name: train-node
        type: execution
        step: train
        override:
          # an explicit `false` must win over the step's `true`
          autorestart: false
    edges: []

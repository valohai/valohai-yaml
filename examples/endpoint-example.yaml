- endpoint:
    name: server-endpoint
    image: python:3.6
    port: 1453
    server-command: python run_server.py

- endpoint:
    name: wsgi-endpoint
    description: predict digits from image inputs
    image: tensorflow/tensorflow:1.3.0-py3
    wsgi: predict_wsgi:predict_wsgi
    files:
      - name: model
        description: Model output file from TensorFlow
        path: model.pb

- endpoint:
    name: limited-endpoint
    image: python:3.9
    server-command:
      - python run_server.py
    resources:
      cpu:
        min: 0.1
        max: 1
      memory:
        min: 50 # in MB
        max: 100 # in MB

- endpoint:
    name: accelerated-endpoint
    image: python:3.6
    server-command: python run_server.py
    node-selector: accelerator=tesla-v100
    resources:
      devices:
        nvidia.com/gpu: 1

- endpoint:
    name: tolerant-endpoint
    image: python:3.6
    server-command: python run_server.py
    tolerations:
      - key: key1
        operator: Equal
        value: value1
        effect: NoSchedule

- endpoint:
    name: ephemeral-storage-endpoint
    image: python:3.9
    server-command: python run_server.py
    resources:
      memory:
        max: 64 # in MB
      ephemeral-storage:
        min: 2048 # in MB
        max: 4096 # in MB

- endpoint:
    name: shared-volume-endpoint
    image: python:3.14
    server-command: python run_server.py
    shared-volumes:
      - pvc-name: app-cache-august
        mount-path: /var/cache/app

      - pvc-name: my-shared-models # the name of the PVC on the cluster
        mount-path: /models # where to mount the volume during runtime
        sub-path: predict-models # optional, sub-path on the volume to mount
        read-only: true # optional, defaults to false
